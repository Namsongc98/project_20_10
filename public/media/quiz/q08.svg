<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- Câu đố: bàn chân + hòn đá + chiếc gối mềm = CHÂN CỨNG ĐÁ MỀM -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF8F0"/>
      <stop offset="1" stop-color="#FDE8EC"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>

  <!-- Bàn chân -->
  <g transform="translate(215 400) scale(0.8)">
    <g fill="#F5CBA7" stroke="#D99E78" stroke-width="5">
      <ellipse cx="-55" cy="-205" rx="34" ry="40"/>
      <ellipse cx="5" cy="-222" rx="23" ry="27"/>
      <ellipse cx="46" cy="-213" rx="20" ry="24"/>
      <ellipse cx="80" cy="-194" rx="17" ry="20"/>
      <ellipse cx="104" cy="-166" rx="14" ry="17"/>
    </g>
    <path d="M-5 -170 C 80 -175, 118 -120, 102 -30 C 90 50, 66 110, 60 160 C 50 222, -50 222, -58 160 C -64 105, -100 40, -98 -40 C -96 -120, -75 -168, -5 -170Z" fill="#F5CBA7" stroke="#D99E78" stroke-width="5"/>
    <g fill="#F48FA6">
      <ellipse cx="-55" cy="-222" rx="17" ry="15"/>
      <ellipse cx="5" cy="-234" rx="12" ry="10"/>
      <ellipse cx="46" cy="-225" rx="10" ry="9"/>
      <ellipse cx="80" cy="-205" rx="8" ry="7"/>
      <ellipse cx="104" cy="-176" rx="7" ry="6"/>
    </g>
  </g>

  <!-- Dấu cộng -->
  <g fill="#9B435A">
    <rect x="395" y="351" width="60" height="18" rx="9"/>
    <rect x="416" y="330" width="18" height="60" rx="9"/>
    <rect x="825" y="351" width="60" height="18" rx="9"/>
    <rect x="846" y="330" width="18" height="60" rx="9"/>
  </g>

  <!-- Hòn đá -->
  <g transform="translate(640 380)">
    <ellipse cy="108" rx="150" ry="16" fill="#9B435A" opacity="0.12"/>
    <path d="M-140 80 C -150 10, -110 -70, -40 -90 C 30 -120, 110 -80, 135 -20 C 160 40, 140 90, 90 100 L -100 100 C -130 100, -140 90, -140 80Z" fill="#9A9AA6" stroke="#6F6F7C" stroke-width="6" stroke-linejoin="round"/>
    <path d="M-40 -90 L -20 -10 L -110 40 M-20 -10 L 70 20 L 135 -20 M70 20 L 90 100" fill="none" stroke="#6F6F7C" stroke-width="4" stroke-linejoin="round" opacity="0.7"/>
    <ellipse cx="-60" cy="-45" rx="28" ry="14" fill="#FFFFFF" opacity="0.3" transform="rotate(-25 -60 -45)"/>
  </g>

  <!-- Chiếc gối mềm -->
  <g transform="translate(1065 375)">
    <path d="M-150 -70 C -110 -100, 110 -100, 150 -70 C 172 0, 172 40, 150 80 C 110 110, -110 110, -150 80 C -172 40, -172 0, -150 -70Z" fill="#FDE8EC" stroke="#F48FA6" stroke-width="6" stroke-linejoin="round"/>
    <path d="M-150 -70 L -128 -52 M150 -70 L 128 -52 M-150 80 L -128 62 M150 80 L 128 62" stroke="#F48FA6" stroke-width="5" stroke-linecap="round"/>
    <path d="M-70 -20 Q 0 10 70 -20 M-60 40 Q 0 60 60 40" fill="none" stroke="#F4C7CF" stroke-width="5" stroke-linecap="round"/>
    <circle r="10" fill="#F48FA6"/>
  </g>
</svg>
