      <stop offset="0" stop-color="#FFF8F0"/>
      <stop offset="1" stop-color="#FDE8EC"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>

  <!-- Bàn chân -->
  <g transform="translate(320 390)">
    <g fill="#F5CBA7" stroke="#D99E78" stroke-width="5">
      <ellipse cx="-55" cy="-205" rx="34" ry="40"/>
