      <rect x="-74" y="-90" width="34" height="40"/>
      <rect x="-18" y="-90" width="34" height="40"/>
      <rect x="38" y="-90" width="34" height="40"/>
      <rect x="94" y="-90" width="34" height="40"/>
      <rect x="-130" y="-60" width="260" height="230"/>
    </g>
    <g fill="#EBC7AE">
