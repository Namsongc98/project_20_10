<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- Câu đố: nhiệt kế (NHIỆT) + trái tim (TÌNH) = NHIỆT TÌNH -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF8F0"/>
      <stop offset="1" stop-color="#FDE8EC"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>

  <!-- Nhiệt kế đang lên cao -->
  <g transform="translate(330 380)">
    <g fill="none" stroke="#F48FA6" stroke-width="8" stroke-linecap="round">
      <path d="M-120 -40 q -22 -25 0 -50 q 22 -25 0 -50 q -22 -25 0 -50"/>
      <path d="M-170 10 q -22 -25 0 -50 q 22 -25 0 -50 q -22 -25 0 -50"/>
    </g>
    <rect x="-40" y="-250" width="80" height="340" rx="40" fill="#FFFFFF" stroke="#C9C9D3" stroke-width="6"/>
    <circle cx="0" cy="120" r="74" fill="#FFFFFF" stroke="#C9C9D3" stroke-width="6"/>
    <rect x="-37" y="40" width="74" height="60" fill="#FFFFFF"/>
    <rect x="-17" y="-205" width="34" height="320" rx="17" fill="#E04B4B"/>
    <circle cx="0" cy="120" r="54" fill="#E04B4B"/>
    <ellipse cx="-18" cy="102" rx="12" ry="18" fill="#FFFFFF" opacity="0.4"/>
    <g stroke="#9B435A" stroke-width="5" stroke-linecap="round">
      <line x1="55" y1="-200" x2="85" y2="-200"/>
      <line x1="55" y1="-160" x2="75" y2="-160"/>
      <line x1="55" y1="-120" x2="85" y2="-120"/>
      <line x1="55" y1="-80" x2="75" y2="-80"/>
      <line x1="55" y1="-40" x2="85" y2="-40"/>
      <line x1="55" y1="0" x2="75" y2="0"/>
      <line x1="55" y1="40" x2="85" y2="40"/>
    </g>
  </g>

  <!-- Dấu cộng -->
  <g fill="#9B435A">
    <rect x="610" y="351" width="60" height="18" rx="9"/>
    <rect x="631" y="330" width="18" height="60" rx="9"/>
  </g>

  <!-- Trái tim -->
  <g transform="translate(960 390)">
    <path d="M0 150 C -60 100, -190 20, -190 -70 C -190 -140, -130 -180, -80 -180 C -40 -180, -12 -155, 0 -125 C 12 -155, 40 -180, 80 -180 C 130 -180, 190 -140, 190 -70 C 190 20, 60 100, 0 150Z" fill="#E8577A"/>
    <ellipse cx="-110" cy="-95" rx="24" ry="40" fill="#FFFFFF" opacity="0.35" transform="rotate(-35 -110 -95)"/>
  </g>
</svg>
