    <rect x="-240" y="-30" width="480" height="150" rx="18" fill="#3A3A44"/>
    <g fill="#55555F">
      <rect x="-220" y="-12" width="44" height="34" rx="6"/>
      <rect x="-168" y="-12" width="44" height="34" rx="6"/>
      <rect x="-116" y="-12" width="44" height="34" rx="6"/>
      <rect x="-64" y="-12" width="44" height="34" rx="6"/>
      <rect x="-12" y="-12" width="44" height="34" rx="6"/>
      <rect x="40" y="-12" width="44" height="34" rx="6"/>
      <rect x="92" y="-12" width="44" height="34" rx="6"/>
      <rect x="144" y="-12" width="44" height="34" rx="6"/>
      <rect x="-200" y="30" width="44" height="34" rx="6"/>
      <rect x="-148" y="30" width="44" height="34" rx="6"/>
      <rect x="-96" y="30" width="44" height="34" rx="6"/>
      <rect x="-44" y="30" width="44" height="34" rx="6"/>
      <rect x="8" y="30" width="44" height="34" rx="6"/>
      <rect x="60" y="30" width="44" height="34" rx="6"/>
      <rect x="112" y="30" width="44" height="34" rx="6"/>
      <rect x="164" y="30" width="56" height="34" rx="6"/>
      <rect x="-130" y="72" width="260" height="32" rx="6"/>
    </g>
    <g fill="#7DB88A">
      <rect x="-64" y="-12" width="44" height="34" rx="6"/>
      <rect x="40" y="-12" width="44" height="34" rx="6"/>
    </g>
    <path d="M250 -260 C 190 -210, 140 -170, 90 -120" fill="none" stroke="#6C8EBF" stroke-width="64" stroke-linecap="round"/>
    <ellipse cx="40" cy="-90" rx="92" ry="58" fill="#F5CBA7" stroke="#D99E78" stroke-width="4"/>
    <g fill="#F5CBA7" stroke="#D99E78" stroke-width="4">
      <rect x="-52" y="-100" width="30" height="96" rx="15"/>
