<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- Câu đố: số 100 + ngón cái giơ lên (TRĂM HAY) + dấu ≠ (KHÔNG BẰNG) + bàn tay gõ phím thành thạo (TAY QUEN) = TRĂM HAY KHÔNG BẰNG TAY QUEN -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF8F0"/>
      <stop offset="1" stop-color="#FDE8EC"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>

  <!-- Số 100 -->
  <text x="190" y="440" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="180" font-weight="700" fill="#9B435A">100</text>

  <!-- Ngón tay cái giơ lên: HAY -->
  <g transform="translate(445 395)">
    <rect x="-46" y="-150" width="46" height="130" rx="23" fill="#F5CBA7" stroke="#D99E78" stroke-width="4" transform="rotate(-8 -23 -85)"/>
    <rect x="-62" y="-40" width="124" height="140" rx="30" fill="#F5CBA7" stroke="#D99E78" stroke-width="4"/>
    <g stroke="#D99E78" stroke-width="4" stroke-linecap="round">
      <line x1="0" y1="-6" x2="56" y2="-6"/>
      <line x1="0" y1="28" x2="58" y2="28"/>
      <line x1="0" y1="62" x2="56" y2="62"/>
    </g>
    <rect x="-72" y="96" width="144" height="40" rx="8" fill="#6C8EBF"/>
    <g fill="#F2C14E">
      <path d="M-110 -150 l 8 -22 l 8 22 l 22 8 l -22 8 l -8 22 l -8 -22 l -22 -8Z"/>
      <path d="M90 -120 l 6 -16 l 6 16 l 16 6 l -16 6 l -6 16 l -6 -16 l -16 -6Z"/>
    </g>
  </g>

  <!-- Dấu khác (≠): KHÔNG BẰNG -->
  <g fill="#9B435A">
    <rect x="598" y="330" width="84" height="18" rx="9"/>
    <rect x="598" y="372" width="84" height="18" rx="9"/>
  </g>
  <line x1="618" y1="420" x2="662" y2="300" stroke="#9B435A" stroke-width="14" stroke-linecap="round"/>

  <!-- Bàn tay gõ phím thành thạo: TAY QUEN -->
