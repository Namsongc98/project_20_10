<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- Câu đố: nhiều quạt nhỏ cùng thổi gió dồn về một chỗ (GÓP GIÓ) → mũi tên (THÀNH) → mây giông, sét, gió xoáy (BÃO) = GÓP GIÓ THÀNH BÃO -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF8F0"/>
      <stop offset="1" stop-color="#FDE8EC"/>
    </linearGradient>
    <g id="fan">
      <rect x="-6" y="40" width="12" height="62" rx="5" fill="#9AA6B2"/>
      <ellipse cy="104" rx="42" ry="12" fill="#9AA6B2"/>
      <circle r="58" fill="#FFFFFF" stroke="#9AA6B2" stroke-width="6"/>
      <g fill="#F48FA6">
        <ellipse cy="-26" rx="16" ry="28"/>
        <ellipse cy="-26" rx="16" ry="28" transform="rotate(120)"/>
        <ellipse cy="-26" rx="16" ry="28" transform="rotate(240)"/>
      </g>
      <circle r="11" fill="#9B435A"/>
      <g fill="none" stroke="#C9C9D3" stroke-width="2">
        <circle r="40"/>
      </g>
    </g>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>

  <!-- Ba chiếc quạt nhỏ -->
  <use href="#fan" transform="translate(150 150) scale(0.85)"/>
  <use href="#fan" transform="translate(150 360) scale(0.85)"/>
  <use href="#fan" transform="translate(150 570) scale(0.85)"/>

  <!-- Các luồng gió nhỏ dồn về một chỗ -->
  <g fill="none" stroke="#8CCBE6" stroke-width="9" stroke-linecap="round">
    <path d="M220 140 C 320 120, 380 200, 440 260 C 480 300, 520 330, 560 345"/>
    <path d="M220 360 C 300 340, 360 380, 440 360 C 490 348, 520 355, 560 360"/>
    <path d="M220 580 C 320 600, 380 520, 440 460 C 480 420, 520 390, 560 375"/>
  </g>
  <g fill="none" stroke="#8CCBE6" stroke-width="6" stroke-linecap="round">
    <path d="M300 128 c 18 -18 42 -4 30 14 c -8 10 -22 4 -16 -6"/>
    <path d="M330 350 c 18 -18 42 -4 30 14 c -8 10 -22 4 -16 -6"/>
    <path d="M300 590 c 18 18 42 4 30 -14 c -8 -10 -22 -4 -16 6"/>
  </g>

  <!-- Mũi tên: THÀNH -->
  <g fill="#9B435A">
    <rect x="585" y="345" width="90" height="30" rx="15"/>
    <polygon points="665,315 725,360 665,405"/>
  </g>

  <!-- Cơn bão: gió xoáy, mây giông, sét, mưa -->
  <g transform="translate(990 330)">
    <g fill="none" stroke="#8CCBE6" stroke-width="10" stroke-linecap="round" opacity="0.75">
      <path d="M-210 60 C -250 -60, -120 -200, 40 -190 C 170 -182, 250 -80, 230 20"/>
      <path d="M220 110 C 200 210, 60 260, -60 230"/>
      <path d="M-170 140 C -140 190, -90 210, -40 212"/>
    </g>
    <g fill="#4A4A6A">
      <circle cx="-110" cy="0" r="78"/>
      <circle cx="-20" cy="-55" r="100"/>
      <circle cx="85" cy="-15" r="85"/>
      <circle cx="150" cy="30" r="58"/>
      <rect x="-188" y="0" width="396" height="86" rx="43"/>
    </g>
    <g fill="#5E5E80">
      <circle cx="-40" cy="-80" r="42"/>
      <circle cx="70" cy="-40" r="34"/>
    </g>
    <polygon points="-10,70 -60,170 -20,170 -50,260 40,140 0,140 30,70" fill="#F7B733"/>
    <polygon points="120,80 95,135 118,135 100,185 150,120 128,120 146,80" fill="#F7B733"/>
    <g stroke="#6FB7D4" stroke-width="7" stroke-linecap="round">
      <line x1="-150" y1="110" x2="-170" y2="160"/>
      <line x1="-110" y1="120" x2="-130" y2="170"/>
      <line x1="60" y1="110" x2="40" y2="160"/>
      <line x1="170" y1="110" x2="150" y2="160"/>
      <line x1="-140" y1="190" x2="-160" y2="240"/>
      <line x1="80" y1="190" x2="60" y2="240"/>
    </g>
  </g>
</svg>
