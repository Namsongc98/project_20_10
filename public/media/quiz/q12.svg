<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- Câu đố: cây tre già (đeo kính, râu bạc, trán nhăn) + măng non đang nhú lên = TRE GIÀ MĂNG MỌC -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF8F0"/>
      <stop offset="1" stop-color="#FDE8EC"/>
    </linearGradient>
    <linearGradient id="oldCulm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B9A452"/>
      <stop offset="0.5" stop-color="#D6C574"/>
      <stop offset="1" stop-color="#A8934A"/>
    </linearGradient>
    <linearGradient id="shoot" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8FB36A"/>
      <stop offset="0.5" stop-color="#B7D28A"/>
      <stop offset="1" stop-color="#7FA35C"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>

  <!-- Mặt đất -->
  <path d="M0 600 Q 320 580 640 600 T 1280 600 L1280 720 L0 720Z" fill="#C98B55"/>
  <path d="M0 600 Q 320 580 640 600 T 1280 600 L1280 616 Q 960 596 640 616 T 0 616Z" fill="#7DB88A"/>

  <!-- Bụi tre già -->
  <g>
    <!-- Lá tre ngả vàng -->
    <g fill="#A9B85E">
      <ellipse cx="200" cy="120" rx="70" ry="13" transform="rotate(25 200 120)"/>
      <ellipse cx="455" cy="140" rx="70" ry="13" transform="rotate(-25 455 140)"/>
      <ellipse cx="180" cy="180" rx="60" ry="11" transform="rotate(40 180 180)"/>
      <ellipse cx="480" cy="200" rx="60" ry="11" transform="rotate(-40 480 200)"/>
    </g>
    <g fill="#8FA84F">
      <ellipse cx="270" cy="70" rx="64" ry="12" transform="rotate(-30 270 70)"/>
      <ellipse cx="395" cy="65" rx="64" ry="12" transform="rotate(30 395 65)"/>
      <ellipse cx="330" cy="40" rx="14" ry="50"/>
    </g>
    <!-- Hai thân phụ -->
    <rect x="232" y="150" width="40" height="455" rx="12" fill="url(#oldCulm)"/>
    <rect x="392" y="120" width="40" height="485" rx="12" fill="url(#oldCulm)"/>
    <g stroke="#8C7A38" stroke-width="5">
      <line x1="232" y1="250" x2="272" y2="250"/>
      <line x1="232" y1="360" x2="272" y2="360"/>
      <line x1="232" y1="470" x2="272" y2="470"/>
      <line x1="392" y1="220" x2="432" y2="220"/>
      <line x1="392" y1="330" x2="432" y2="330"/>
      <line x1="392" y1="440" x2="432" y2="440"/>
    </g>
    <!-- Thân chính có khuôn mặt ông cụ -->
    <rect x="285" y="70" width="90" height="535" rx="20" fill="url(#oldCulm)"/>
    <g stroke="#8C7A38" stroke-width="6">
      <line x1="285" y1="190" x2="375" y2="190"/>
      <line x1="285" y1="440" x2="375" y2="440"/>
      <line x1="285" y1="530" x2="375" y2="530"/>
    </g>
    <g fill="none" stroke="#8C7A38" stroke-width="3" stroke-linecap="round">
      <path d="M305 222 q 25 -8 50 0"/>
      <path d="M310 234 q 20 -6 40 0"/>
    </g>
    <g fill="none" stroke="#4A4A55" stroke-width="4">
      <circle cx="313" cy="268" r="15"/>
      <circle cx="347" cy="268" r="15"/>
      <line x1="328" y1="268" x2="332" y2="268"/>
    </g>
    <g fill="none" stroke="#1F1417" stroke-width="4" stroke-linecap="round">
      <path d="M306 270 q 7 -6 14 0 M340 270 q 7 -6 14 0"/>
    </g>
    <path d="M300 300 C 302 350, 318 395, 330 420 C 342 395, 358 350, 360 300 C 345 315, 315 315, 300 300Z" fill="#FFFFFF" stroke="#DADAE2" stroke-width="3"/>
    <path d="M308 300 Q 330 290 352 300 Q 330 312 308 300Z" fill="#FFFFFF" stroke="#DADAE2" stroke-width="2"/>
  </g>

  <!-- Dấu cộng -->
  <g fill="#9B435A">
    <rect x="610" y="351" width="60" height="18" rx="9"/>
    <rect x="631" y="330" width="18" height="60" rx="9"/>
  </g>

  <!-- Măng non đang nhú lên -->
  <g fill="none" stroke="#7DB88A" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 14">
    <path d="M820 420 L 820 300"/>
    <path d="M960 340 L 960 200"/>
    <path d="M1095 450 L 1095 350"/>
  </g>
  <g fill="#7DB88A">
    <polygon points="802,300 820,272 838,300"/>
    <polygon points="942,200 960,172 978,200"/>
    <polygon points="1077,350 1095,322 1113,350"/>
  </g>
  <g>
    <ellipse cx="820" cy="602" rx="62" ry="14" fill="#A0663A"/>
    <path d="M770 600 C 775 520, 805 460, 820 440 C 835 460, 865 520, 870 600Z" fill="url(#shoot)"/>
    <path d="M778 560 Q 820 530 862 560 M790 510 Q 820 488 850 510" fill="none" stroke="#6E9E58" stroke-width="4"/>

    <ellipse cx="960" cy="604" rx="82" ry="16" fill="#A0663A"/>
    <path d="M895 600 C 902 490, 940 400, 960 370 C 980 400, 1018 490, 1025 600Z" fill="url(#shoot)"/>
    <path d="M905 545 Q 960 510 1015 545 M918 475 Q 960 448 1002 475" fill="none" stroke="#6E9E58" stroke-width="4"/>
    <circle cx="942" cy="560" r="7" fill="#1F1417"/>
    <circle cx="978" cy="560" r="7" fill="#1F1417"/>
    <ellipse cx="928" cy="578" rx="10" ry="6" fill="#F48FA6" opacity="0.8"/>
    <ellipse cx="992" cy="578" rx="10" ry="6" fill="#F48FA6" opacity="0.8"/>
    <path d="M948 580 Q 960 592 972 580" fill="none" stroke="#9B435A" stroke-width="4" stroke-linecap="round"/>

    <ellipse cx="1095" cy="602" rx="52" ry="12" fill="#A0663A"/>
    <path d="M1055 600 C 1060 540, 1083 495, 1095 478 C 1107 495, 1130 540, 1135 600Z" fill="url(#shoot)"/>
    <path d="M1062 565 Q 1095 545 1128 565" fill="none" stroke="#6E9E58" stroke-width="4"/>
  </g>
  <g fill="#F2C14E">
    <path d="M880 400 l 6 -16 l 6 16 l 16 6 l -16 6 l -6 16 l -6 -16 l -16 -6Z"/>
    <path d="M1040 300 l 5 -12 l 5 12 l 12 5 l -12 5 l -5 12 l -5 -12 l -12 -5Z"/>
  </g>
</svg>
