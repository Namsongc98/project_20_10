<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- Câu đố: bông hoa (HOA) + mảng màu hồng (HỒNG) = HOA HỒNG -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF8F0"/>
      <stop offset="1" stop-color="#FDE8EC"/>
    </linearGradient>
    <g id="petal"><ellipse cx="0" cy="-78" rx="46" ry="74"/></g>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>

  <!-- Bông hoa -->
  <g transform="translate(330 330)">
    <path d="M0 90 C -10 200, 10 260, 0 330" stroke="#5E9B6B" stroke-width="16" fill="none" stroke-linecap="round"/>
    <path d="M2 230 C 60 180, 120 200, 140 220 C 100 260, 40 260, 2 230 Z" fill="#7DB88A"/>
    <path d="M-2 280 C -60 230, -120 250, -140 270 C -100 310, -40 310, -2 280 Z" fill="#7DB88A"/>
    <g fill="#FFFFFF" stroke="#E9D7C0" stroke-width="4">
      <use href="#petal" transform="rotate(0)"/>
      <use href="#petal" transform="rotate(60)"/>
      <use href="#petal" transform="rotate(120)"/>
      <use href="#petal" transform="rotate(180)"/>
      <use href="#petal" transform="rotate(240)"/>
      <use href="#petal" transform="rotate(300)"/>
    </g>
    <circle r="44" fill="#F2C14E"/>
    <circle r="44" fill="none" stroke="#D8A73A" stroke-width="4"/>
  </g>

  <!-- Dấu cộng -->
  <g fill="#9B435A">
    <rect x="610" y="306" width="60" height="18" rx="9"/>
    <rect x="631" y="285" width="18" height="60" rx="9"/>
  </g>

  <!-- Vệt sơn màu hồng -->
  <g transform="translate(950 330)">
    <path d="M-190 -40 C -170 -150, -40 -170, 30 -140 C 120 -170, 210 -100, 190 -10 C 230 70, 150 160, 50 140 C -30 190, -160 160, -170 70 C -230 40, -220 -10, -190 -40 Z" fill="#E8577A"/>
    <circle cx="-210" cy="-120" r="22" fill="#E8577A"/>
    <circle cx="210" cy="120" r="16" fill="#E8577A"/>
    <circle cx="170" cy="-160" r="12" fill="#E8577A"/>
    <circle cx="-120" cy="200" r="20" fill="#E8577A"/>
    <path d="M-60 140 C -60 190, -40 220, -50 250" stroke="#E8577A" stroke-width="22" fill="none" stroke-linecap="round"/>
  </g>
</svg>
