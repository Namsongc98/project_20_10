<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- Câu đố: số 1 + mặt trời (MỘT NẮNG) + số 2 + giọt sương trên lá (HAI SƯƠNG) = MỘT NẮNG HAI SƯƠNG -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF8F0"/>
      <stop offset="1" stop-color="#FDE8EC"/>
    </linearGradient>
    <path id="drop" d="M0 -40 C 18 -15, 28 0, 28 14 C 28 32, 14 42, 0 42 C -14 42, -28 32, -28 14 C -28 0, -18 -15, 0 -40Z"/>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>

  <!-- 1 + mặt trời -->
  <text x="170" y="455" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="280" font-weight="700" fill="#9B435A">1</text>
  <g transform="translate(415 360)">
    <g stroke="#F2C14E" stroke-width="14" stroke-linecap="round">
      <line y1="-112" y2="-152"/>
      <line y1="-112" y2="-152" transform="rotate(30)"/>
      <line y1="-112" y2="-152" transform="rotate(60)"/>
      <line y1="-112" y2="-152" transform="rotate(90)"/>
      <line y1="-112" y2="-152" transform="rotate(120)"/>
      <line y1="-112" y2="-152" transform="rotate(150)"/>
      <line y1="-112" y2="-152" transform="rotate(180)"/>
      <line y1="-112" y2="-152" transform="rotate(210)"/>
      <line y1="-112" y2="-152" transform="rotate(240)"/>
      <line y1="-112" y2="-152" transform="rotate(270)"/>
      <line y1="-112" y2="-152" transform="rotate(300)"/>
      <line y1="-112" y2="-152" transform="rotate(330)"/>
    </g>
    <circle r="92" fill="#F7B733"/>
    <circle cx="-30" cy="-12" r="9" fill="#9B435A"/>
    <circle cx="30" cy="-12" r="9" fill="#9B435A"/>
    <path d="M-34 24 Q 0 52 34 24" fill="none" stroke="#9B435A" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- Dấu cộng -->
  <g fill="#9B435A">
    <rect x="610" y="351" width="60" height="18" rx="9"/>
    <rect x="631" y="330" width="18" height="60" rx="9"/>
  </g>

  <!-- 2 + giọt sương trên lá -->
  <text x="810" y="455" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="280" font-weight="700" fill="#9B435A">2</text>
  <g transform="translate(1075 380)">
    <path d="M-140 90 C -120 -60, 40 -160, 150 -130 C 140 0, 25 115, -140 90Z" fill="#7DB88A"/>
    <path d="M-130 82 C -45 15, 40 -60, 140 -122" fill="none" stroke="#5E9B6B" stroke-width="5"/>
    <g fill="#BFE6F5" stroke="#6FB7D4" stroke-width="3">
      <use href="#drop" transform="translate(-35 -5) scale(1.1)"/>
      <use href="#drop" transform="translate(55 -62) scale(0.8)"/>
      <use href="#drop" transform="translate(55 30) scale(0.9)"/>
      <use href="#drop" transform="translate(-100 175) scale(0.7)"/>
    </g>
    <g fill="#FFFFFF" opacity="0.8">
      <ellipse cx="-44" cy="5" rx="7" ry="11"/>
      <ellipse cx="48" cy="-55" rx="5" ry="8"/>
      <ellipse cx="47" cy="38" rx="6" ry="9"/>
    </g>
  </g>
</svg>
